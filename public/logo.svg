<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="redShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="45%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="whitePlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="darkBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagonal / Shield Base -->
  <path d="M100 10 L175 45 L175 130 L100 190 L25 130 L25 45 Z" 
        fill="url(#darkBgGrad)" stroke="#dc2626" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Inner Red Shield Inset -->
  <path d="M100 22 L163 52 L163 124 L100 176 L37 124 L37 52 Z" 
        fill="url(#redShieldGrad)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Sharp White Wing Accents -->
  <path d="M50 72 L70 56 L100 68 L130 56 L150 72" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

  <!-- Barbell Bar in Pure White -->
  <rect x="40" y="85" width="120" height="7" rx="3.5" fill="#ffffff" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.5))"/>
  
  <!-- Barbell Center Grips -->
  <rect x="84" y="83" width="32" height="11" rx="2" fill="#7f1d1d" stroke="#ffffff" stroke-width="1.5"/>
  
  <!-- Left Weight Plates (White with Red Grooves) -->
  <rect x="52" y="68" width="9" height="41" rx="3" fill="url(#whitePlateGrad)" stroke="#dc2626" stroke-width="1"/>
  <rect x="41" y="73" width="8" height="31" rx="2.5" fill="url(#whitePlateGrad)" stroke="#7f1d1d" stroke-width="1"/>
  <rect x="34" y="79" width="5" height="19" rx="2" fill="#ffffff"/>
  <rect x="63" y="83" width="4" height="11" rx="1.5" fill="#18181b"/>

  <!-- Right Weight Plates (White with Red Grooves) -->
  <rect x="139" y="68" width="9" height="41" rx="3" fill="url(#whitePlateGrad)" stroke="#dc2626" stroke-width="1"/>
  <rect x="151" y="73" width="8" height="31" rx="2.5" fill="url(#whitePlateGrad)" stroke="#7f1d1d" stroke-width="1"/>
  <rect x="161" y="79" width="5" height="19" rx="2" fill="#ffffff"/>
  <rect x="133" y="83" width="4" height="11" rx="1.5" fill="#18181b"/>

  <!-- Star Badge on Top (Pure White) -->
  <polygon points="100,31 103,39 112,40 105,46 107,55 100,50 93,55 95,46 88,40 97,39" fill="#ffffff" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.5))"/>

  <!-- Brand Typography: THE GYM (Bold White) -->
  <text x="100" y="125" text-anchor="middle" font-family="'Montserrat', 'Impact', sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="3" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.9))">
    THE GYM
  </text>

  <!-- Brand Typography: TOWN (Vivid White on Red) -->
  <text x="100" y="148" text-anchor="middle" font-family="'Montserrat', 'Impact', sans-serif" font-size="17" font-weight="900" fill="#ffffff" letter-spacing="5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.9))">
    TOWN
  </text>

  <!-- Sub-ribbon: HYDERABAD (White on Dark Tab) -->
  <rect x="55" y="156" width="90" height="14" rx="4" fill="#09090b" stroke="#ffffff" stroke-width="1"/>
  <text x="100" y="166" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="800" fill="#ffffff" letter-spacing="2">
    HYDERABAD
  </text>
</svg>
